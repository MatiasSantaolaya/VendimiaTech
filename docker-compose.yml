services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - plane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plane"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plane
    ports:
      - "3000:3000"
volumes:
  plane_pgdata:
